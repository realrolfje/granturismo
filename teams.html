<!doctype html>
<html lang="en">

    <meta charset="utf-8" />

    <title>Gran Turismo 7 | Teams & Drivers</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js" defer></script>
    <script src="main.js" defer></script>
  </head>
  <body class="theme-dark">
    <header class="hero" id="top">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Light mode</button>

        <p class="eyebrow">Gran Turismo 7</p>

        <div class="hero__nav" role="navigation">

      <section id="teams-section" class="panel" aria-labelledby="teams-heading">
        <div id="teams-list" class="card-grid" role="list"></div>
      </section>

    <template id="team-card-template">

        <ul class="team-card__drivers"></ul>
