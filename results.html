<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="cache-control" content="max-age=60" />
    <title data-i18n="pageTitles.results">Gran Turismo 7 | Race Results</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css" />
    <script src="i18n.js" defer></script>
    <script src="theme.js" defer></script>
    <script src="rounds.js" defer></script>
    <script src="raceFields.js" defer></script>
    <script src="main.js" defer></script>
  </head>
  <body class="theme-dark">
    <header class="hero" id="top">
      <div class="hero__top-actions">
        <div class="hero__round-selector">
          <select id="round-select" aria-label="Select a round" data-i18n-attr="aria-label" data-i18n-attr-key="controls.roundSelect"></select>
        </div>
        <div class="hero__language-selector">
          <button
            id="language-toggle"
            type="button"
            class="hero__language-toggle"
            data-i18n-attr="aria-label"
            data-i18n-attr-key="controls.languageSelect"
          >
            <span class="hero__language-flag" aria-hidden="true">🌐</span>
            <span class="hero__language-label sr-only" aria-live="polite"></span>
          </button>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <span class="theme-toggle__icon" aria-hidden="true">☀️</span>
        </button>
      </div>
      <div class="hero__content">
        <p class="eyebrow">Gran Turismo 7</p>
        <h1 data-i18n="results.heroTitle">Race Results</h1>
        <div class="hero__nav" role="navigation">
          <a class="pill-link" href="index.html" data-i18n="nav.standings">Standings</a>
          <a class="pill-link pill-link--active" href="results.html" data-i18n="nav.results">Race Results</a>
          <a id="upcoming-pill" class="pill-link" href="races.html" data-i18n="nav.upcoming">Upcoming Races</a>
          <a class="pill-link" href="teams.html" data-i18n="nav.teams">Teams &amp; Drivers</a>
          <a class="pill-link" href="rules.html" data-i18n="nav.rules">Scoring Rules</a>
          <a class="pill-link" href="editor.html" data-i18n="nav.editor">Race Editor</a>
        </div>
      </div>
    </header>

    <main>
      <section id="races-section" class="panel" aria-labelledby="races-heading">
        <div id="races-container" class="race-list"></div>
      </section>
    </main>

    <template id="race-card-template">
      <article class="race-card">
        <header class="race-card__header">
          <div class="race-card__header-main">
            <p class="eyebrow"></p>
            <h3>
              <button type="button" class="race-card__title-btn"></button>
            </h3>
          </div>
          <div class="race-card__header-actions">
            <p class="race-card__meta"></p>
            <button type="button" class="race-card__proof-btn" hidden>proof</button>
          </div>
        </header>
        <div class="race-card__details" hidden></div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th scope="col">Pos</th>
                <th scope="col">Driver</th>
                <th scope="col">Car</th>
                <th scope="col">Team</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </article>
    </template>
    <div id="proof-modal" class="proof-modal" hidden>
      <div class="proof-modal__dialog">
        <button type="button" class="proof-modal__close" aria-label="Close proof viewer" data-i18n-attr="aria-label" data-i18n-attr-key="proof.close">&times;</button>
        <img class="proof-modal__image" alt="" />
      </div>
    </div>
  </body>
</html>
