<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gran Turismo 7 | Scoreboard</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js" defer></script>
    <script src="main.js" defer></script>
  </head>
  <body class="theme-dark">
    <header class="hero" id="top">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Light mode</button>
      <div class="hero__content">
        <p class="eyebrow">Gran Turismo 7</p>
        <h1>League Scoreboard</h1>
        <div class="hero__nav" role="navigation">
          <a class="pill-link pill-link--active" href="index.html">Standings</a>
          <a class="pill-link" href="teams.html">Teams &amp; Drivers</a>
          <a class="pill-link" href="results.html">Race Results</a>
          <a id="upcoming-pill" class="pill-link" href="races.html">Upcoming Races</a>
          <a class="pill-link" href="rules.html">Scoring Rules</a>
          <a class="pill-link" href="editor.html">Race Editor</a>
        </div>
      </div>
    </header>

    <main>
      <section id="standings-section" class="panel panel--standings" aria-labelledby="standings-heading">
        <div class="callouts">
          <article class="callout">
            <p class="eyebrow">Driver Leader</p>
            <h3 id="driver-leader-name">TBD</h3>
            <p class="muted" id="driver-leader-points"></p>
          </article>
          <article class="callout">
            <p class="eyebrow">Team Leader</p>
            <h3 id="team-leader-name">TBD</h3>
            <p class="muted" id="team-leader-points"></p>
          </article>
        </div>
        <div class="standings-grid">
          <article>
            <header class="standings__header">
              <h3>Driver Points</h3>
            </header>
            <div class="table-wrapper">
              <table class="standings-table">
                <thead>
                  <tr>
                    <th scope="col">Rank</th>
                    <th scope="col">Driver</th>
                    <th scope="col">Points</th>
                    <th scope="col">Wins</th>
                  </tr>
                </thead>
                <tbody id="driver-standings-body"></tbody>
              </table>
            </div>
          </article>

          <article>
            <header class="standings__header">
              <h3>Team Points</h3>
            </header>
            <div class="table-wrapper">
              <table class="standings-table">
                <thead>
                  <tr>
                    <th scope="col">Rank</th>
                    <th scope="col">Team</th>
                    <th scope="col">Points</th>
                    <th scope="col">Wins</th>
                  </tr>
                </thead>
                <tbody id="team-standings-body"></tbody>
              </table>
            </div>
          </article>
        </div>
      </section>

    </main>
  </body>
</html>
